name: Spread Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  tests-spread:
    name: Test 'bazel-snap-${{ matrix.arch.name }}'
    runs-on: ${{ matrix.arch.runs-on }}

    strategy:
      matrix:
        arch:
          - { name: amd64, runs-on: ubuntu-26.04 }
          - { name: arm64, runs-on: ubuntu-26.04-arm }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Snapcraft Build
        uses: canonical/action-build@v1
      - name: Integration Tests
        run: sudo -u $USER -E /snap/snapcraft/current/libexec/snapcraft/craft.spread lxd -vv
